<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iqtisodiyot Fakulteti — Talabalar bazasi</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Iqtisodiyot Fakulteti — Talabalar bazasi</h1>
    <div class="user-info">
      <span id="userLabel"></span>
      <span id="roleBadge" class="role-badge"></span>
      <button class="btn btn-sm" id="logoutBtn">Chiqish</button>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Ism bo'yicha qidirish..." />
      <select id="groupFilter">
        <option value="">Barcha guruhlar</option>
      </select>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="addStudentBtn" hidden>+ Yangi talaba</button>
    </div>

    <div id="studentGrid" class="grid"></div>
    <p id="emptyState" class="empty-state" hidden>Hech narsa topilmadi</p>
  </main>

  <!-- Student detail/edit modal -->
  <div class="modal-overlay" id="studentModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Talaba</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/app.js"></script>
</body>
</html>
