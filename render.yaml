services:
  - type: web
    name: tafu-iqtisodiyot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: USER_USERNAME
        value: user
      - key: USER_PASSWORD
        sync: false
